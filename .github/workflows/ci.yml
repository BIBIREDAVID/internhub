name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  # Firebase client config isn't secret (it's shipped in the browser bundle
  # either way), but CI has no .env — without these, firebase.js's getAuth()
  # throws synchronously on the missing apiKey and crashes the whole app
  # before React ever renders, taking every e2e test down with it. These
  # are placeholders; e2e tests never make a real Firebase call.
  VITE_FIREBASE_API_KEY: ci-placeholder-key
  VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
  VITE_FIREBASE_PROJECT_ID: ci-placeholder
  VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.firebasestorage.app
  VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000000000"

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is generated on Windows and some platform-gated
      # optional dependencies (e.g. wasm32-wasi napi bindings) only fully
      # resolve their own sub-dependencies when npm install runs on the
      # matching OS, so the lockfile isn't reliably complete for Linux and
      # `npm ci`'s strict sync check fails here. `npm install` re-resolves
      # instead of requiring an exact match.
      - run: npm install

      - run: npm run lint

      - run: npm test

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm run test:e2e
