name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  VITE_API_URL: http://localhost:4000

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is generated on Windows and some platform-gated
      # optional dependencies (e.g. wasm32-wasi napi bindings) only fully
      # resolve their own sub-dependencies when npm install runs on the
      # matching OS, so the lockfile isn't reliably complete for Linux and
      # `npm ci`'s strict sync check fails here. `npm install` re-resolves
      # instead of requiring an exact match.
      - run: npm install

      - run: npm run lint

      - run: npm test

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: internhub
          POSTGRES_PASSWORD: internhub
          POSTGRES_DB: internhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U internhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://internhub:internhub@localhost:5432/internhub
      JWT_SECRET: ci-test-secret-not-for-production
      PORT: 4000
      CORS_ORIGIN: http://localhost:4173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - run: npm run db:migrate

      - run: npm run seed

      - run: npm run test:e2e
